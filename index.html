<!DOCTYPE html>
<html lang="sl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Echo</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon.ico" sizes="any">
<link rel="icon" href="./icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<meta name="theme-color" content="#0B0908">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0B0908;
    --bg-elevated: #161210;
    --bg-elevated-2: #1E1815;
    --ember: #A83C2C;
    --ember-dim: #5A2A20;
    --ember-glow: rgba(168, 60, 44, 0.35);
    --text: #EDE6DE;
    --text-muted: #948A80;
    --text-faint: #5C554E;
    --success: #6B8F71;
    --danger: #B85450;
    --font-display: 'Fraunces', serif;
    --font-body: 'Inter', sans-serif;
    --font-mono: 'JetBrains Mono', monospace;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-tap-highlight-color: transparent;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  }

  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
  }

  header {
    padding: 20px 20px 8px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  header h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 28px;
    margin: 0;
    letter-spacing: 0.01em;
  }
  header p {
    margin: 0;
    color: var(--text-faint);
    font-size: 13px;
  }

  main { flex: 1; overflow: hidden; position: relative; }
  .view { display: none; height: 100%; overflow-y: auto; padding: 0 20px 20px; }
  .view.active { display: block; }

  /* ---------- Record view ---------- */
  #view-record {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 28px;
  }
  #view-record.active { display: flex; }

  #rings {
    --amp: 1;
    position: relative;
    width: 220px;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #rings .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid var(--ember-dim);
    transition: transform 0.08s ease-out, opacity 0.08s ease-out;
  }
  #rings .ring:nth-child(1) { width: 100%; height: 100%; opacity: 0.25; transform: scale(calc(var(--amp) * 1)); }
  #rings .ring:nth-child(2) { width: 76%; height: 76%; opacity: 0.4; transform: scale(calc(var(--amp) * 0.95)); }
  #rings .ring:nth-child(3) { width: 52%; height: 52%; opacity: 0.6; transform: scale(calc(var(--amp) * 0.9)); }

  #record-btn {
    position: relative;
    z-index: 2;
    width: 88px; height: 88px;
    border-radius: 50%;
    border: none;
    background: var(--ember-dim);
    box-shadow: 0 0 0 0 var(--ember-glow);
    cursor: pointer;
    transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  #record-btn::after {
    content: "";
    display: block;
    width: 22px; height: 22px;
    margin: 0 auto;
    border-radius: 6px;
    background: var(--text);
    opacity: 0.9;
  }
  #record-btn.recording {
    background: var(--ember);
    box-shadow: 0 0 0 8px var(--ember-glow);
    animation: pulse 1.8s ease-in-out infinite;
  }
  #record-btn.recording::after { border-radius: 50%; }
  #record-btn:active { transform: scale(0.96); }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 8px var(--ember-glow); }
    50% { box-shadow: 0 0 0 14px transparent; }
  }

  #record-status {
    color: var(--text-muted);
    font-size: 14px;
    min-height: 20px;
    text-align: center;
  }

  #session-prompt {
    position: fixed;
    inset: auto 20px 90px 20px;
    max-width: 440px;
    margin: 0 auto;
    background: var(--bg-elevated-2);
    border-radius: 16px;
    padding: 16px;
    display: none;
    flex-direction: column;
    gap: 10px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
  #session-prompt.visible { display: flex; }
  #session-prompt p { margin: 0 0 4px; font-size: 14px; color: var(--text-muted); }
  #session-prompt .choices { display: flex; gap: 10px; }
  #session-prompt button {
    flex: 1;
    padding: 14px;
    border-radius: 10px;
    border: 1px solid var(--ember-dim);
    background: transparent;
    color: var(--text);
    font-size: 15px;
    font-family: var(--font-body);
    cursor: pointer;
  }
  #session-prompt button:active { background: var(--ember-dim); }

  /* ---------- Review view ---------- */
  #view-review h2, #view-settings h2 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 20px;
    margin: 20px 0 12px;
  }
  .empty { color: var(--text-faint); font-size: 14px; margin-top: 40px; text-align: center; }

  .session-group { margin-bottom: 24px; }
  .session-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .session-header h3 {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin: 0;
  }
  .export-btn {
    background: none;
    border: 1px solid var(--ember-dim);
    color: var(--ember);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }

  .capture-card {
    background: var(--bg-elevated);
    border-radius: 14px;
    padding: 14px;
    margin-bottom: 10px;
  }
  .capture-meta {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .wake-time { color: var(--text); }
  .badge {
    background: var(--ember-dim);
    color: var(--text);
    border-radius: 6px;
    padding: 2px 8px;
    font-family: var(--font-body);
  }
  .status {
    margin-left: auto;
    color: var(--text-faint);
    text-transform: capitalize;
  }
  .status-reviewed, .status-imported { color: var(--success); }

  .transcript-edit {
    width: 100%;
    min-height: 90px;
    background: var(--bg-elevated-2);
    border: none;
    border-radius: 10px;
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.5;
    padding: 10px;
    resize: vertical;
  }
  .transcript-edit:focus { outline: 2px solid var(--ember-dim); }

  .capture-actions {
    display: flex;
    gap: 8px;
    margin-top: 10px;
  }
  .capture-actions button {
    background: none;
    border: 1px solid var(--text-faint);
    color: var(--text-muted);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .capture-actions button.danger { border-color: var(--danger); color: var(--danger); }

  /* ---------- Settings view ---------- */
  .setting-block { margin-bottom: 28px; }
  .setting-block label.title {
    display: block;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  #lang-select {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--bg-elevated-2);
    background: var(--bg-elevated);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
  }
  #model-select {
    width: 100%;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--bg-elevated-2);
    background: var(--bg-elevated);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
  }
  .pending-exports-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--bg-elevated);
    border-radius: 12px;
    padding: 12px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .pending-exports-row button {
    background: none;
    border: 1px solid var(--ember-dim);
    color: var(--ember);
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .audio-player {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--bg-elevated-2);
    border-radius: 10px;
    padding: 8px 12px;
    margin-bottom: 14px;
  }
  .audio-player audio {
    display: none; /* hidden -- driven entirely via JS, see wireAudioPlayer() */
  }
  .audio-play-btn {
    flex: none;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: none;
    background: var(--ember-dim);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .audio-play-btn svg { width: 14px; height: 14px; }
  .audio-download-btn {
    flex: none;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1px solid var(--text-faint);
    background: none;
    color: var(--text-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
  }
  .audio-download-btn svg { width: 13px; height: 13px; }
  .audio-download-btn:hover, .audio-download-btn:focus {
    color: var(--text);
    border-color: var(--ember);
  }
  .audio-seek {
    flex: 1;
    height: 3px;
    accent-color: var(--ember);
  }
  .audio-time {
    flex: none;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--text-faint);
    min-width: 38px;
    text-align: right;
  }
  .transport-option {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg-elevated);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 8px;
  }
  .transport-option strong { font-size: 14px; }
  .transport-option p { margin: 2px 0 0; font-size: 12px; color: var(--text-faint); }
  .config-status {
    display: inline-block;
    margin-top: 6px;
    font-size: 11px;
    font-family: var(--font-mono);
    padding: 2px 8px;
    border-radius: 6px;
  }
  .config-status.ok { background: rgba(107, 143, 113, 0.15); color: var(--success); }
  .config-status.pending { background: rgba(184, 84, 80, 0.15); color: var(--danger); }
  .transport-option button {
    margin-left: auto;
    background: none;
    border: 1px solid var(--ember-dim);
    color: var(--ember);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 12px;
    white-space: nowrap;
  }

  /* ---------- Modal dialogs (replace native alert/confirm/prompt) ---------- */
  #modal-root {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
  }
  #modal-root.visible { display: block; }
  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-box {
    background: var(--bg-elevated-2);
    border-radius: 16px;
    padding: 20px;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 12px 40px rgba(0,0,0,0.5);
  }
  .modal-message {
    font-size: 15px;
    line-height: 1.5;
    color: var(--text);
    margin-bottom: 16px;
    white-space: pre-line;
  }
  .modal-input {
    width: 100%;
    margin-top: 10px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--bg-elevated);
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 14px;
  }
  .modal-input:focus { outline: 2px solid var(--ember-dim); }
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
  }
  .modal-btn {
    padding: 10px 16px;
    border-radius: 10px;
    border: 1px solid var(--text-faint);
    background: none;
    color: var(--text-muted);
    font-family: var(--font-body);
    font-size: 14px;
    cursor: pointer;
  }
  .modal-btn.primary {
    border-color: var(--ember);
    background: var(--ember-dim);
    color: var(--text);
  }
  .modal-btn:focus { outline: 2px solid var(--ember); }

  #toast-root {
    position: fixed;
    left: 50%;
    bottom: calc(76px + env(safe-area-inset-bottom));
    transform: translateX(-50%) translateY(10px);
    max-width: calc(100% - 40px);
    background: var(--bg-elevated-2);
    color: var(--text);
    border: 1px solid var(--ember-dim);
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 14px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 60;
  }
  #toast-root.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ---------- Bottom nav ---------- */
  nav.tabbar {
    display: flex;
    gap: 4px;
    border-top: 1px solid var(--bg-elevated-2);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: var(--bg-elevated);
  }
  nav.tabbar button {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    border-radius: 12px;
    color: var(--text-faint);
    font-family: var(--font-body);
    font-weight: 500;
    font-size: 12px;
    padding: 8px 0;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }
  nav.tabbar button .icon {
    width: 20px;
    height: 20px;
    display: block;
  }
  nav.tabbar button .icon svg { width: 100%; height: 100%; }
  nav.tabbar button .icon circle,
  nav.tabbar button .icon path,
  nav.tabbar button .icon rect { stroke: currentColor; }
  nav.tabbar button.active {
    color: var(--text);
    background: var(--ember-dim);
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 data-i18n="app.name">Echo</h1>
    <p data-i18n="app.tagline">Ujemi sanje, preden zbledijo</p>
  </header>

  <main>
    <section id="view-record" class="view active">
      <div id="rings">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
        <button id="record-btn" aria-label="Record"></button>
      </div>
      <div id="record-status"></div>
    </section>

    <section id="view-review" class="view">
      <h2 data-i18n="review.title">Pregled posnetkov</h2>
      <div id="review-list"></div>
    </section>

    <section id="view-settings" class="view">
      <h2 data-i18n="settings.title">Nastavitve</h2>
      <div class="setting-block">
        <label class="title" data-i18n="settings.language">Jezik</label>
        <select id="lang-select"></select>
      </div>
      <div class="setting-block">
        <label class="title" data-i18n="settings.model.title">Model za prepis</label>
        <p style="font-size:12px;color:var(--text-faint);margin-top:-4px" data-i18n="settings.model.hint"></p>
        <select id="model-select"></select>
      </div>
      <div class="setting-block">
        <label class="title" data-i18n="settings.transport">Prenos podatkov</label>
        <p style="font-size:12px;color:var(--text-faint);margin-top:-4px" data-i18n="settings.transportHint"></p>
        <div id="transport-list"></div>
      </div>
      <div class="setting-block" id="pending-exports-block" style="display:none">
        <label class="title" data-i18n="settings.pendingExports">Izvozi v čakalni vrsti</label>
        <div class="pending-exports-row">
          <span id="pending-exports-count"></span>
          <button id="retry-exports-btn" data-i18n="settings.retryNow">Poskusi zdaj</button>
        </div>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <button data-view="record" class="active">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"></circle></svg></span>
      <span data-i18n="nav.record">Snemaj</span>
    </button>
    <button data-view="review">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="17" rx="2"></rect><path d="M8 8h8M8 12h8M8 16h5"></path></svg></span>
      <span data-i18n="nav.review">Pregled</span>
    </button>
    <button data-view="settings">
      <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><path d="M12 3.5v2.4M12 18.1v2.4M20.5 12h-2.4M5.9 12H3.5M17.7 6.3l-1.7 1.7M8 16l-1.7 1.7M17.7 17.7L16 16M8 8L6.3 6.3"></path></svg></span>
      <span data-i18n="nav.settings">Nastavitve</span>
    </button>
  </nav>

  <div id="session-prompt">
    <p data-i18n="record.sessionPrompt"></p>
    <div class="choices">
      <button data-choice="continue" data-i18n="record.continuesPrevious"></button>
      <button data-choice="new" data-i18n="record.newDream"></button>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root"></div>
</div>
<script type="module" src="./lib/app.js"></script>
</body>
</html>
